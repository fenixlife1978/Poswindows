<div class="panel h-full flex flex-col bg-[#EBE9ED] p-2 border-2 border-[#808080] shadow-inner">
  <!-- Cabecera de Módulo -->
  <div class="border-b-2 border-[#000080] mb-4 pb-1 flex justify-between items-end">
    <div>
      <h2 class="text-xl font-black italic uppercase text-[#000080] leading-none">Catálogo de Productos</h2>
      <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mt-1">Maestro de Inventario y Precios</p>
    </div>
    
    <!-- Barra de Herramientas Rápida -->
    <div class="flex gap-1 mb-1">
      <button onclick="abrirModalProducto()" class="win-tool-btn !h-10 !min-w-[140px] !flex-row !gap-2 hover:bg-white active:bg-gray-200">
        <span class="text-blue-700 text-xl font-black">+</span>
        <span class="text-[9px] font-black italic">F2 - Nuevo Producto</span>
      </button>
      <button onclick="crearCategoriaPrompt()" class="win-tool-btn !h-10 !min-w-[140px] !flex-row !gap-2 hover:bg-white active:bg-gray-200">
        <span class="text-amber-700 text-xl font-black">📁</span>
        <span class="text-[9px] font-black italic">Nueva Categoría</span>
      </button>
    </div>
  </div>

  <!-- Área de Búsqueda y Filtros -->
  <fieldset class="mb-4 bg-[#D4D0C8]/30">
    <legend>Filtros de Búsqueda</legend>
    <div class="flex items-center gap-4 py-1">
      <div class="flex items-center gap-2 flex-1">
        <label class="text-[10px] font-black uppercase text-[#404040]">Criterio:</label>
        <input id="buscarProductos" class="flex-1 h-6 border border-gray-400 px-2 text-xs font-bold uppercase focus:bg-[#FFFACD]" placeholder="BUSCAR POR NOMBRE, CÓDIGO O MARCA...">
      </div>
      <div class="flex items-center gap-2">
        <label class="text-[10px] font-black uppercase text-[#404040]">Categoría:</label>
        <select id="filtroCategoria" class="h-6 border border-gray-400 text-[10px] font-bold uppercase px-1">
          <option value="TODOS">TODAS LAS CATEGORÍAS</option>
        </select>
      </div>
      <button class="h-6 px-4 bg-[#EBE9ED] border border-gray-500 text-[9px] font-black uppercase shadow-sm hover:bg-white">Actualizar</button>
    </div>
  </fieldset>

  <!-- Tabla de Datos Principal -->
  <div class="flex-1 overflow-hidden border-2 border-[#808080] bg-white shadow-inner relative">
    <table class="win-table">
      <thead class="bg-[#D4D0C8] sticky top-0 z-10">
        <tr>
          <th class="w-32 border-r border-[#808080]">Código / SKU</th>
          <th class="border-r border-[#808080]">Descripción del Producto</th>
          <th class="w-40 border-r border-[#808080]">Categoría</th>
          <th class="w-32 border-r border-[#808080]">Precio USD</th>
          <th class="w-24 border-r border-[#808080]">Stock</th>
          <th class="w-32">Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaProductos" class="font-mono text-[10px] uppercase">
        <!-- Las filas se inyectan dinámicamente -->
        <tr class="hover:bg-blue-50 cursor-pointer">
          <td colspan="6" class="py-20 text-center text-gray-400 italic font-black uppercase tracking-tighter">
            Cargando registros del inventario...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Barra de Estado Inferior del Módulo -->
  <div class="mt-2 bg-[#D4D0C8] border border-[#808080] p-1 flex justify-between items-center text-[9px] font-black uppercase text-[#404040]">
    <div class="flex gap-4">
      <span>Total Items: <span id="countProductos" class="text-blue-800">0</span></span>
      <span>Stock Valorizado: <span id="valorTotalStock" class="text-green-800">$0.00</span></span>
    </div>
    <div class="italic">SVP ERP v2.0 - Módulo de Inventario</div>
  </div>
</div>

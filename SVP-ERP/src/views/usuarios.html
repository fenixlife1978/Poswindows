<div class="panel h-full flex flex-col bg-[#EBE9ED] p-2 border-2 border-[#808080] shadow-inner">
  <!-- Cabecera de Módulo -->
  <div class="border-b-2 border-[#000080] mb-4 pb-1 flex justify-between items-end">
    <div>
      <h2 class="text-xl font-black italic uppercase text-[#000080] leading-none">Usuarios del Sistema</h2>
      <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mt-1">Control de Accesos y Roles de Usuario</p>
    </div>
    
    <button onclick="nuevoUsuario()" class="win-tool-btn !h-10 !min-w-[140px] !flex-row !gap-2 hover:bg-white active:bg-gray-200">
      <span class="text-blue-700 text-xl font-black">+</span>
      <span class="text-[9px] font-black italic">F2 - Nuevo Usuario</span>
    </button>
  </div>

  <!-- Tabla de Datos Principal -->
  <div class="flex-1 overflow-hidden border-2 border-[#808080] bg-white shadow-inner relative">
    <table class="win-table">
      <thead class="bg-[#D4D0C8] sticky top-0 z-10">
        <tr>
          <th class="border-r border-[#808080]">Nombre Completo</th>
          <th class="w-48 border-r border-[#808080]">Nombre de Usuario</th>
          <th class="w-40 border-r border-[#808080]">Rol / Perfil</th>
          <th class="w-32">Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaUsuarios" class="font-mono text-[10px] uppercase">
        <!-- Las filas se inyectan dinámicamente -->
        <tr class="hover:bg-blue-50 cursor-pointer">
          <td colspan="4" class="py-20 text-center text-gray-400 italic font-black uppercase tracking-tighter">
            Cargando lista de operadores autorizados...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Barra de Estado Inferior -->
  <div class="mt-2 bg-[#D4D0C8] border border-[#808080] p-1 flex justify-between items-center text-[9px] font-black uppercase text-[#404040]">
    <div class="italic">SVP ERP v2.0 - Módulo de Seguridad y Auditoría</div>
  </div>
</div>

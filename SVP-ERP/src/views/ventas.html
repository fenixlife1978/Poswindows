<div class="panel h-full flex flex-col bg-[#EBE9ED] p-2 border-2 border-[#808080] shadow-inner">
  <!-- Cabecera de Módulo -->
  <div class="border-b-2 border-[#000080] mb-4 pb-1 flex justify-between items-end">
    <div>
      <h2 class="text-xl font-black italic uppercase text-[#000080] leading-none">Historial de Ventas</h2>
      <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mt-1">Consulta de Operaciones y Facturación Realizada</p>
    </div>
    
    <div class="flex gap-1 mb-1">
      <button class="win-tool-btn !h-10 !min-w-[120px] !flex-row !gap-2 hover:bg-white active:bg-gray-200">
        <span class="text-blue-700 text-sm">🖨️</span>
        <span class="text-[9px] font-black italic">Imprimir Reporte</span>
      </button>
    </div>
  </div>

  <!-- Área de Búsqueda y Filtros -->
  <fieldset class="mb-4 bg-[#D4D0C8]/30">
    <legend>Filtros de Auditoría</legend>
    <div class="flex items-center gap-4 py-1">
      <div class="flex items-center gap-2 flex-1">
        <label class="text-[10px] font-black uppercase text-[#404040]">Buscar:</label>
        <input 
          id="buscarVenta" 
          class="flex-1 h-6 border border-gray-400 px-2 text-xs font-bold uppercase focus:bg-[#FFFACD]" 
          placeholder="Buscar factura"
        >
      </div>
      <button class="h-6 px-4 bg-[#EBE9ED] border border-gray-500 text-[9px] font-black uppercase shadow-sm hover:bg-white">Buscar</button>
    </div>
  </fieldset>

  <!-- Tabla de Datos Principal -->
  <div class="flex-1 overflow-hidden border-2 border-[#808080] bg-white shadow-inner relative">
    <table class="win-table">
      <thead class="bg-[#D4D0C8] sticky top-0 z-10">
        <tr>
          <th class="w-32 border-r border-[#808080]">Número</th>
          <th class="w-48 border-r border-[#808080]">Fecha</th>
          <th class="border-r border-[#808080]">Pago</th>
          <th class="w-40 border-r border-[#808080]">Total USD</th>
          <th class="w-32">Acción</th>
        </tr>
      </thead>
      <tbody id="tablaVentas" class="font-mono text-[10px] uppercase">
        <!-- Las filas se inyectan dinámicamente -->
        <tr class="hover:bg-blue-50 cursor-pointer">
          <td colspan="5" class="py-20 text-center text-gray-400 italic font-black uppercase tracking-tighter">
            No se han cargado registros de ventas...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Barra de Estado Inferior del Módulo -->
  <div class="mt-2 bg-[#D4D0C8] border border-[#808080] p-1 flex justify-between items-center text-[9px] font-black uppercase text-[#404040]">
    <div class="flex gap-4">
      <span>Total Facturas: <span id="countVentas" class="text-blue-800">0</span></span>
      <span>Facturación Bruta: <span id="sumaVentas" class="text-green-800">$0.00</span></span>
    </div>
    <div class="italic">SVP ERP v2.0 - Auditoría de Ingresos</div>
  </div>
</div>
